spring:
  ai:
    model:
      chat: none
    openai:
      base-url: https://openrouter.ai/api
      api-key: test-openrouter-key
      chat:
        enabled: false
        options:
          model: openai/gpt-4.1
          max-tokens: 1536
      embedding:
        enabled: false
      image:
        enabled: false
      moderation:
        enabled: false
      audio:
        transcription:
          enabled: false
        speech:
          enabled: false
  datasource:
    url: jdbc:h2:mem:aiassistant;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  security:
    jwt-secret: test-secret-test-secret-test-secret-test-secret-test-secret
    access-token-minutes: 20
    refresh-token-days: 14
  storage:
    repositories-dir: ./target/test-repositories
  upload:
    max-compressed-bytes: 52428800
    max-expanded-bytes: 209715200
    max-entry-bytes: 10485760
    max-files: 5000
    max-depth: 20
    max-compression-ratio: 25
  indexing:
    enabled: false
    async-enabled: true
  ai:
    prompt:
      max-prompt-characters: 24000
      max-context-characters: 14000
      max-history-characters: 6000
      max-history-messages: 8
    openrouter:
      chat:
        base-url: https://openrouter.ai/api
        api-key: test-openrouter-key
        model: openai/gpt-4.1
        max-tokens: 1536
        timeout: 30s
        max-retries: 2
      enabled: false
