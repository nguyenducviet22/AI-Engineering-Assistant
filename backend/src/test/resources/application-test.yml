spring:
  datasource:
    url: jdbc:h2:mem:aiassistant;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  security:
    jwt-secret: test-secret-test-secret-test-secret-test-secret-test-secret
    access-token-minutes: 20
    refresh-token-days: 14
  storage:
    repositories-dir: ./target/test-repositories
  upload:
    max-compressed-bytes: 52428800
    max-expanded-bytes: 209715200
    max-entry-bytes: 10485760
    max-files: 5000
    max-depth: 20
    max-compression-ratio: 25
  indexing:
    enabled: false
    async-enabled: true
  ai:
    openrouter:
      enabled: false
