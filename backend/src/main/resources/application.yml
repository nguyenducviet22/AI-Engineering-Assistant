server:
  port: 8080

spring:
  application:
    name: ai-engineering-assistant
  ai:
    model:
      chat: openai
    retry:
      max-attempts: ${AI_MAX_RETRIES:2}
    openai:
      base-url: ${OPENROUTER_SPRING_BASE_URL:https://openrouter.ai/api}
      api-key: ${OPENROUTER_API_KEY:}
      chat:
        options:
          model: ${OPENROUTER_CHAT_MODEL:openai/gpt-4.1}
          max-tokens: ${OPENROUTER_CHAT_MAX_TOKENS:1536}
      embedding:
        enabled: false
      image:
        enabled: false
      moderation:
        enabled: false
      audio:
        transcription:
          enabled: false
        speech:
          enabled: false
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:60MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:65MB}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ai_engineering_assistant}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

app:
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-change-this-development-secret}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:20}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:14}
  storage:
    repositories-dir: ${REPOSITORY_STORAGE_DIR:./data/repositories}
  upload:
    max-compressed-bytes: ${UPLOAD_MAX_COMPRESSED_BYTES:52428800}
    max-expanded-bytes: ${UPLOAD_MAX_EXPANDED_BYTES:209715200}
    max-entry-bytes: ${UPLOAD_MAX_ENTRY_BYTES:10485760}
    max-files: ${UPLOAD_MAX_FILES:5000}
    max-depth: ${UPLOAD_MAX_DEPTH:20}
    max-compression-ratio: ${UPLOAD_MAX_COMPRESSION_RATIO:25}
  indexing:
    enabled: ${INDEXING_ENABLED:true}
    async-enabled: ${INDEXING_ASYNC_ENABLED:true}
  ai:
    prompt:
      max-prompt-characters: ${AI_PROMPT_MAX_CHARACTERS:24000}
      max-context-characters: ${AI_PROMPT_MAX_CONTEXT_CHARACTERS:14000}
      max-history-characters: ${AI_PROMPT_MAX_HISTORY_CHARACTERS:6000}
      max-history-messages: ${AI_PROMPT_MAX_HISTORY_MESSAGES:8}
    openrouter:
      chat:
        base-url: ${OPENROUTER_SPRING_BASE_URL:https://openrouter.ai/api}
        api-key: ${OPENROUTER_API_KEY:}
        model: ${OPENROUTER_CHAT_MODEL:openai/gpt-4.1}
        max-tokens: ${OPENROUTER_CHAT_MAX_TOKENS:1536}
        timeout: ${AI_REQUEST_TIMEOUT_SECONDS:30s}
        max-retries: ${AI_MAX_RETRIES:2}
      enabled: ${OPENROUTER_EMBEDDING_ENABLED:true}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      api-key: ${OPENROUTER_API_KEY:}
      embedding-model: ${OPENROUTER_EMBEDDING_MODEL:openai/text-embedding-3-small}
      timeout: ${AI_REQUEST_TIMEOUT_SECONDS:30s}
      max-retries: ${AI_MAX_RETRIES:2}
