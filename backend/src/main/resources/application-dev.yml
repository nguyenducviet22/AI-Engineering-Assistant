spring:
  datasource:
    url: jdbc:h2:file:./data/dev/aiassistant;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

app:
  storage:
    repositories-dir: ./data/dev/repositories
  indexing:
    enabled: false
    async-enabled: true
  ai:
    openrouter:
      enabled: false
